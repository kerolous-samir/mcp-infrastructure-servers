name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install libvirt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvirt-dev pkg-config

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Show what the tests will exercise
        run: |
          python - <<'PY'
          import importlib.util
          for module in ("mcp", "libvirt", "ldap3", "winrm", "psycopg2"):
              spec = importlib.util.find_spec(module)
              print(f"{module:<10} {'present' if spec else 'MISSING (its server tests skip)'}")
          PY

      - name: Run tests
        run: pytest -v
